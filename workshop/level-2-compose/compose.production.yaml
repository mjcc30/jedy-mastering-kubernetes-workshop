services:
  back:
    build:
      context: ./app/back
      dockerfile: ./Dockerfile.prod
    volumes: 
     [] # Disable volume mapping for production

  front:
    build:
      context: ./app/front
      dockerfile: ./Dockerfile
    ports:
      - "8080:4321" # Map host port 4321 to container port 4321
    environment:
      - API_URL=http://back:4000 # Frontend connects to the backend service
    volumes: 
     [] # Disable volume mapping for production