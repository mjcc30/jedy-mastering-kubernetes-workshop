[project]
name = "back"
version = "0.1.0"
description = "A modern Python backend for the StarWarsKubernetes project."
authors = ["GitHub Copilot"]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pytest>=8.3.0",
    "google-generativeai>=0.8.0",
    "Pillow>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
